# ==============================================================================
# Production Template 2: Monorepo Microservices with DAG & Rules Optimization
# Lesson Reference: notes/lesson-02-control-flow-and-optimization.md
# ==============================================================================

stages:
  - lint
  - build
  - test
  - deploy

# Global Workflow Rules to Prevent Duplicate Pipelines
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ------------------------------------------------------------------------------
# Lint Stage (Parallel Zero-Wait Jobs)
# ------------------------------------------------------------------------------
lint:frontend:
  stage: lint
  image: node:20-alpine
  rules:
    - changes:
        - "frontend/**/*"
  script:
    - cd frontend
    - npm ci
    - npm run lint

lint:backend:
  stage: lint
  image: golang:1.22-alpine
  rules:
    - changes:
        - "backend/**/*"
  script:
    - cd backend
    - go vet ./...

# ------------------------------------------------------------------------------
# Build Stage
# ------------------------------------------------------------------------------
build:frontend:
  stage: build
  image: node:20-alpine
  rules:
    - changes:
        - "frontend/**/*"
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    name: "frontend-dist-$CI_COMMIT_SHORT_SHA"
    expire_in: 3 days
    paths:
      - frontend/dist/

build:backend:
  stage: build
  image: golang:1.22-alpine
  rules:
    - changes:
        - "backend/**/*"
  script:
    - cd backend
    - CGO_ENABLED=0 go build -o bin/api main.go
  artifacts:
    name: "backend-bin-$CI_COMMIT_SHORT_SHA"
    expire_in: 3 days
    paths:
      - backend/bin/api

# ------------------------------------------------------------------------------
# Test Stage (DAG Needs)
# ------------------------------------------------------------------------------
test:frontend:
  stage: test
  image: node:20-alpine
  needs:
    - job: build:frontend
      artifacts: true
  rules:
    - changes:
        - "frontend/**/*"
  script:
    - cd frontend
    - npm test

test:backend:
  stage: test
  image: golang:1.22-alpine
  needs:
    - job: build:backend
      artifacts: true
  rules:
    - changes:
        - "backend/**/*"
  script:
    - cd backend
    - go test -v -race ./...

# ------------------------------------------------------------------------------
# Deploy Stage
# ------------------------------------------------------------------------------
deploy:staging:
  stage: deploy
  image: alpine/k8s:1.29.2
  needs:
    - job: test:frontend
      optional: true
    - job: test:backend
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - echo "Deploying microservices to Staging environment..."
